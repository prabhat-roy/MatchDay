# Apache Polaris — Iceberg REST catalog with RBAC + multi-engine support
image: { repository: apache/polaris, tag: latest }
polaris:
  realm: matchday
  storage:
    s3: { endpoint: http://minio.matchday.svc:9000, region: us-east-1, bucket: matchday-iceberg-warehouse }
ingress: { enabled: true, hosts: [{ host: polaris.matchday.internal }] }
