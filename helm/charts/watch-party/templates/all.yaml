apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-watch-party
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }}-watch-party }
spec:
  type: {{ .Values.service.type }}
  ports: [{ port: {{ .Values.service.port }}, targetPort: http, name: http }]
  selector: { app.kubernetes.io/name: watch-party, app.kubernetes.io/instance: {{ .Release.Name }} }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-watch-party
  labels: { app.kubernetes.io/name: watch-party, app.kubernetes.io/part-of: matchday, matchday.io/domain: fan-engagement }
spec:
  serviceName: {{ .Release.Name }}-watch-party
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: watch-party, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app.kubernetes.io/name: watch-party, app.kubernetes.io/instance: {{ .Release.Name }}, matchday.io/domain: fan-engagement } }
    spec:
      serviceAccountName: {{ .Release.Name }}-watch-party
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: watch-party
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          ports:
            - { name: http,  containerPort: {{ .Values.service.targetPort }} }
            - { name: epmd,  containerPort: 4369 }
            - { name: erlang,containerPort: 9100 }
          env:
            - { name: PORT, value: "{{ .Values.service.targetPort }}" }
            {{- range $k, $v := .Values.config }}
            - { name: {{ $k }}, value: "{{ $v }}" }
            {{- end }}
          {{- with .Values.envFrom }}envFrom: {{- toYaml . | nindent 12 }}{{- end }}
          livenessProbe:  {{- toYaml .Values.probes.liveness  | nindent 12 }}
          readinessProbe: {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
