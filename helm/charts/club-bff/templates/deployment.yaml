apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-club-bff
  labels: { app.kubernetes.io/name: club-bff, app.kubernetes.io/part-of: matchday, matchday.io/domain: platform }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app.kubernetes.io/name: club-bff, app.kubernetes.io/instance: {{ .Release.Name }} } }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: club-bff
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}{{- toYaml . | nindent 8 }}{{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-club-bff
      securityContext: {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: club-bff
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: {{ .Values.service.targetPort }} }]
          env:
            - { name: PORT, value: "{{ .Values.service.targetPort }}" }
            {{- range $k, $v := .Values.config }}
            - { name: {{ $k }}, value: "{{ $v }}" }
            {{- end }}
          {{- with .Values.envFrom }}envFrom: {{- toYaml . | nindent 12 }}{{- end }}
          livenessProbe:  {{- toYaml .Values.probes.liveness  | nindent 12 }}
          readinessProbe: {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
