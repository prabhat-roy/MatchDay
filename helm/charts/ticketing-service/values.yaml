image: { repository: matchday/ticketing-service, tag: "" }
replicaCount: 4
service: { type: ClusterIP, port: 50171, targetPort: 50171 }
resources: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: 2000m, memory: 4Gi } }
probes:
  liveness:  { httpGet: { path: /healthz, port: 50171 }, initialDelaySeconds: 60 }
  readiness: { httpGet: { path: /healthz, port: 50171 }, initialDelaySeconds: 30 }
serviceAccount: { create: true, annotations: {} }
podLabels: { app.kubernetes.io/name: ticketing-service, app.kubernetes.io/part-of: matchday, matchday.io/domain: venue, matchday.io/deploy-strategy: "blue-green" }
securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
containerSecurityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
config: { LOG_LEVEL: info, JAVA_OPTS: "-XX:+UseG1GC -Xms512m -Xmx3g" }
envFrom: []
cloud: {}
