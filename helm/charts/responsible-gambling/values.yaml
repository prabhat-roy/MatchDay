image: { repository: matchday/responsible-gambling, tag: "" }
replicaCount: 3
service: { type: ClusterIP, port: 50244, targetPort: 50244 }
resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1000m, memory: 512Mi } }
probes:
  liveness:  { httpGet: { path: /healthz, port: 50244 } }
  readiness: { httpGet: { path: /healthz, port: 50244 } }
serviceAccount: { create: true, annotations: {} }
podLabels: { app.kubernetes.io/name: responsible-gambling, app.kubernetes.io/part-of: matchday, matchday.io/domain: betting, matchday.io/regulated: "true" }
securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
containerSecurityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
config: { LOG_LEVEL: info }
envFrom: []
cloud: {}
