image: { repository: matchday/graphql-gateway, tag: "" }
replicaCount: 2
service: { type: ClusterIP, port: 50004, targetPort: 50004 }
resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1000m, memory: 512Mi } }
probes: { liveness: { httpGet: { path: /healthz, port: 50004 } }, readiness: { httpGet: { path: /healthz, port: 50004 } } }
serviceAccount: { create: true, annotations: {} }
podLabels: { app.kubernetes.io/name: graphql-gateway, app.kubernetes.io/part-of: matchday, matchday.io/domain: platform }
securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
containerSecurityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
config: { LOG_LEVEL: info }
envFrom: []
cloud: {}
