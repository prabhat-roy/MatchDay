apiVersion: flink.apache.org/v1beta1
kind: FlinkSessionJob
metadata: { name: matchday-aggregation, namespace: matchday }
spec:
  deploymentName: matchday-flink
  job:
    jarURI: s3://matchday-flink-jobs/aggregation.jar
    parallelism: 8
    upgradeMode: savepoint
    args: ["--source-topic", "matchday.events.enriched", "--sink-topic", "matchday.metrics.aggregated", "--window", "5m"]
