---
# Marquee-headroom quotas (10x surge support).
apiVersion: v1
kind: ResourceQuota
metadata: { name: matchday-fan-engagement-quota, namespace: matchday-fan-engagement }
spec:
  hard:
    requests.cpu: "200"
    requests.memory: 400Gi
    limits.cpu: "400"
    limits.memory: 800Gi
    pods: "1000"
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: matchday-match-ops-quota, namespace: matchday-match-ops }
spec:
  hard:
    requests.cpu: "150"
    requests.memory: 300Gi
    limits.cpu: "300"
    limits.memory: 600Gi
    pods: "500"
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: matchday-platform-quota, namespace: matchday-platform }
spec:
  hard:
    requests.cpu: "100"
    requests.memory: 200Gi
    limits.cpu: "200"
    limits.memory: 400Gi
    pods: "500"
---
apiVersion: v1
kind: LimitRange
metadata: { name: matchday-platform-limits, namespace: matchday-platform }
spec:
  limits:
    - type: Container
      default:        { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 50m,  memory: 64Mi }
      max:            { cpu: 4,    memory: 4Gi }
