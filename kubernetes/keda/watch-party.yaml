apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: watch-party, namespace: matchday-fan-engagement }
spec:
  scaleTargetRef: { name: watch-party, kind: StatefulSet }
  minReplicaCount: 4
  maxReplicaCount: 50
  pollingInterval: 10
  cooldownPeriod: 900
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.observability:9090
        metricName: phoenix_concurrent_connections
        threshold: "10000"
        query: sum(phoenix_concurrent_connections{app="watch-party"})
