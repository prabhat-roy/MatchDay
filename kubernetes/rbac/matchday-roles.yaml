---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: matchday-service-reader }
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: matchday-platform-admin }
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
# Anti-doping ClusterRole is intentionally append-only — no UPDATE/DELETE on its CRDs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: matchday-anti-doping-reader }
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch]
