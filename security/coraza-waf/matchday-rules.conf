SecRuleEngine On
SecRequestBodyAccess On
SecResponseBodyAccess Off
Include @owasp_crs/*.conf
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(nikto|nmap|sqlmap)" "id:1001,phase:1,deny,status:403,msg:'Banned scanner'"
SecRule ARGS "@detectXSS" "id:1002,phase:2,deny,status:400,log,msg:'XSS attempt'"
SecRule ARGS "@detectSQLi" "id:1003,phase:2,deny,status:400,log,msg:'SQLi attempt'"

# Drops endpoints — anti-bot rules during 10x surge.
SecRule REQUEST_URI "@beginsWith /v1/drops" \
    "id:2001,phase:1,pass,nolog,setvar:tx.matchday_drops=1"
SecRule TX:matchday_drops "@eq 1" \
    "id:2002,phase:1,chain,deny,status:429,msg:'Drops anti-bot rate limit'"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(headlesschrome|phantomjs|selenium)"

# Bet-feed — block if jurisdiction header missing.
SecRule REQUEST_URI "@beginsWith /v1/bet" \
    "id:2010,phase:1,chain,deny,status:400,msg:'bet without jurisdiction header'"
SecRule &REQUEST_HEADERS:X-Jurisdiction "@eq 0"
