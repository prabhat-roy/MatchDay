apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: matchday-vault-issuer }
spec:
  vault:
    server: https://vault.matchday.internal
    path: pki/sign/matchday-mesh
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        secretRef: { name: cert-manager-vault-token, key: token }
