apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: live-data-ingest, namespace: matchday }
spec:
  replicas: 6
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 2m }
        - analysis:
            templates: [{ templateName: matchday-canary-analysis }]
            args: [{ name: service-name, value: live-data-ingest }]
        - setWeight: 25
        - pause: { duration: 3m }
        - setWeight: 100
  selector: { matchLabels: { app.kubernetes.io/name: live-data-ingest } }
  template:
    metadata: { labels: { app.kubernetes.io/name: live-data-ingest } }
    spec:
      containers:
        - name: live-data-ingest
          image: harbor.matchday.internal/matchday/live-data-ingest:latest
          ports: [{ containerPort: 50143 }]
