syntax = "proto3";
package matchday.fantasy.v1;
import "common/types.proto";
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.fantasy.v1";
option java_multiple_files = true;

// payout-service: payout settlement, KYC checks before payout.
service PayoutService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
