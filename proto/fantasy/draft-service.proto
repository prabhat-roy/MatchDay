syntax = "proto3";
package matchday.fantasy.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.fantasy.v1";
option java_multiple_files = true;

// draft-service: draft auctions, snake drafts.
service DraftService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
