syntax = "proto3";
package matchday.fantasy.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.fantasy.v1";
option java_multiple_files = true;

// fantasy-league: league creation, head-to-head leagues, gameweek state.
service FantasyLeagueService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
