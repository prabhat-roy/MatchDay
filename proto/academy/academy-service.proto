syntax = "proto3";
package matchday.academy.v1;
import "common/types.proto";
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.academy.v1";
option java_multiple_files = true;

// academy-service: academy roster — minors data subject to COPPA.
// Parental consent token MUST be present on read of minor records.
service AcademyService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
