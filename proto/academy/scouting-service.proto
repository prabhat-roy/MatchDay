syntax = "proto3";
package matchday.academy.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.academy.v1";
option java_multiple_files = true;

// scouting-service: scout reports, watchlist.
service ScoutingService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
