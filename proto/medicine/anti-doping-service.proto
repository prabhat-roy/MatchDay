syntax = "proto3";
package matchday.medicine.v1;
import "common/types.proto";
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.medicine.v1";
option java_multiple_files = true;

// anti-doping-service: WADA-compliant test results.
// SILOED — separate Postgres cluster + namespace + KMS keys.
// Records are append-only; no Update/Delete RPCs are exposed.
service AntiDopingService {
  rpc Health(HealthRequest) returns (HealthResponse);
  // Mutating RPCs intentionally absent — append-only audit trail.
}
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
