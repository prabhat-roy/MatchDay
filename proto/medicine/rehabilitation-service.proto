syntax = "proto3";
package matchday.medicine.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.medicine.v1";
option java_multiple_files = true;

// rehabilitation-service: rehab plan tracking, progression milestones.
service RehabilitationService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
