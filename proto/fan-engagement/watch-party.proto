syntax = "proto3";
package matchday.fanengagement.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.fanengagement.v1";
option java_multiple_files = true;

// watch-party: real-time multi-user viewing rooms (Elixir/Phoenix Channels).
// Presence + chat fan-out scales to 500K+ concurrent connections.
service WatchPartyService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
