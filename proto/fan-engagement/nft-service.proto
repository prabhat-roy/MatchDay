syntax = "proto3";
package matchday.fanengagement.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.fanengagement.v1";
option java_multiple_files = true;

// nft-service: digital collectibles (off-chain metadata, optional on-chain anchor).
service NftService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
