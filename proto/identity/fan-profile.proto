syntax = "proto3";
package matchday.identity.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.identity.v1";
option java_multiple_files = true;

// fan-profile: fan identity, preferences, club affinity, KYC for betting.
service FanProfileService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
