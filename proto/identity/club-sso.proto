syntax = "proto3";
package matchday.identity.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.identity.v1";
option java_multiple_files = true;

// club-sso: SSO for club staff (coaches, analysts, medics) — federated to club IdP.
service ClubSsoService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
