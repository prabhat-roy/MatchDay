syntax = "proto3";
package matchday.analytics.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.analytics.v1";
option java_multiple_files = true;

// scout-ai: similarity model on Neo4j athlete graph + collaborative filtering.
service ScoutAiService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
