syntax = "proto3";
package matchday.broadcast.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.broadcast.v1";
option java_multiple_files = true;

// rights-service: territory rights, blackout windows.
service RightsService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
