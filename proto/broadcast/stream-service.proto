syntax = "proto3";
package matchday.broadcast.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.broadcast.v1";
option java_multiple_files = true;

// stream-service: live stream packaging (LL-HLS, DASH) — Rust.
service StreamService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
