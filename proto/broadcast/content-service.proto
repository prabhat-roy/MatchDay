syntax = "proto3";
package matchday.broadcast.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.broadcast.v1";
option java_multiple_files = true;

// content-service: editorial content, EPG, multi-language metadata.
service ContentService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
