syntax = "proto3";
package matchday.notifications.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.notifications.v1";
option java_multiple_files = true;

// push-service: APNs / FCM dispatch.
service PushService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
