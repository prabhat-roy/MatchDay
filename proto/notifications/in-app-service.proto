syntax = "proto3";
package matchday.notifications.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.notifications.v1";
option java_multiple_files = true;

// in-app-service: in-app inbox, presence updates over WebSocket.
service InAppService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
