syntax = "proto3";
package matchday.betting.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.betting.v1";
option java_multiple_files = true;

// risk-management: trader / liability rebalancing, suspicious-bet flagging.
service RiskManagementService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
