syntax = "proto3";
package matchday.betting.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.betting.v1";
option java_multiple_files = true;

// odds-service: live odds compilation, market lifecycle.
service OddsService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
