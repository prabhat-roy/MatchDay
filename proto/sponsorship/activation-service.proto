syntax = "proto3";
package matchday.sponsorship.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.sponsorship.v1";
option java_multiple_files = true;

// activation-service: sponsor activation campaigns, in-stadium / digital surfaces.
service ActivationService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
