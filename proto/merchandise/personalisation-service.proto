syntax = "proto3";
package matchday.merchandise.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.merchandise.v1";
option java_multiple_files = true;

// personalisation-service: name/number printing, custom kit upsells.
service PersonalisationService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
