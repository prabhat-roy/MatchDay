syntax = "proto3";
package matchday.platform.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.platform.v1";
option java_multiple_files = true;

// media-bff: aggregator for broadcasters and rights-holders (clip, highlight, EPG).
service MediaBffService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
