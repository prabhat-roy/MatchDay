syntax = "proto3";
package matchday.platform.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.platform.v1";
option java_multiple_files = true;

// fan-bff: aggregates fan-facing reads (fixtures, scores, fantasy) for fan portal/mobile.
service FanBffService {
  rpc Health(HealthRequest) returns (HealthResponse);
}
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
