syntax = "proto3";
package matchday.league.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.league.v1";
option java_multiple_files = true;

// league-service: competitions and federations registry.
service LeagueService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
