syntax = "proto3";
package matchday.athlete.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.athlete.v1";
option java_multiple_files = true;

// profile-service: public profile, social handles, sponsorship affiliations.
service AthleteProfileService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
