syntax = "proto3";
package matchday.athlete.v1;
import "common/types.proto";
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.athlete.v1";
option java_multiple_files = true;

// biometric-service: SILOED athlete biometric ingestion (FIFA EPTS).
// Time-series payloads land in TimescaleDB; access requires AuditMetadata.
service BiometricService {
  rpc Health(HealthRequest) returns (HealthResponse);
}
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
