syntax = "proto3";
package matchday.matchops.v1;
import "common/types.proto";
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.matchops.v1";
option java_multiple_files = true;

// live-data-ingest: OPTA/StatsBomb feed -> match-ops.event.recorded Kafka topic.
// Out-of-order events handled by EventTime; idempotent on (match_id, sequence).
service LiveDataIngestService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
