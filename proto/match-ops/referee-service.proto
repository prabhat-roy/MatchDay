syntax = "proto3";
package matchday.matchops.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.matchops.v1";
option java_multiple_files = true;

// referee-service: referee assignments, decisions log.
service RefereeService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
