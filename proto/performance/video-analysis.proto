syntax = "proto3";
package matchday.performance.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.performance.v1";
option java_multiple_files = true;

// video-analysis: tactical clip cataloguing, AI tag enrichment.
service VideoAnalysisService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
