syntax = "proto3";
package matchday.performance.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.performance.v1";
option java_multiple_files = true;

// kpi-service: rolled-up performance KPIs available to club dashboard.
service KpiService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
