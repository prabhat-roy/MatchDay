syntax = "proto3";
package matchday.performance.v1;
import "common/types.proto";
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.performance.v1";
option java_multiple_files = true;

// gps-tracking: 25Hz EPTS GPS ingestion -> TimescaleDB hypertable per match.
service GpsTrackingService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
