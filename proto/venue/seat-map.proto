syntax = "proto3";
package matchday.venue.v1;
import "google/protobuf/timestamp.proto";
option java_package = "com.matchday.venue.v1";
option java_multiple_files = true;

// seat-map: 3D venue / seat allocation.
service SeatMapService { rpc Health(HealthRequest) returns (HealthResponse); }
message HealthRequest {}
message HealthResponse { string status = 1; google.protobuf.Timestamp checked_at = 2; }
