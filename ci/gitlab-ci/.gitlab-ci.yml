stages: [build, scan, sign, push]
variables:
  REGISTRY: harbor.matchday.internal
  COSIGN_EXPERIMENTAL: '1'

.kaniko_build:
  stage: build
  image: gcr.io/kaniko-project/executor:debug
  script:
    - >-
      /kaniko/executor
      --context "$CI_PROJECT_DIR/$SERVICE_DIR"
      --dockerfile "$CI_PROJECT_DIR/$SERVICE_DIR/Dockerfile"
      --destination "${REGISTRY}/matchday/${SERVICE_NAME}:${CI_COMMIT_SHA}"
      --cache=true

.trivy_scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --exit-code 1 --severity CRITICAL,HIGH "${REGISTRY}/matchday/${SERVICE_NAME}:${CI_COMMIT_SHA}"

.syft_sbom:
  stage: scan
  image: anchore/syft:latest
  script:
    - syft "${REGISTRY}/matchday/${SERVICE_NAME}:${CI_COMMIT_SHA}" -o cyclonedx-json > sbom.json
  artifacts: { paths: [sbom.json] }

.cosign_sign:
  stage: sign
  image: gcr.io/projectsigstore/cosign:latest
  script:
    - cosign sign --yes "${REGISTRY}/matchday/${SERVICE_NAME}:${CI_COMMIT_SHA}"

# Representative service job — extend per service or generate child pipelines.
live-data-ingest:
  variables: { SERVICE_DIR: src/match-ops/live-data-ingest, SERVICE_NAME: live-data-ingest }
  extends: [.kaniko_build, .trivy_scan, .syft_sbom, .cosign_sign]

bet-feed:
  variables: { SERVICE_DIR: src/betting/bet-feed, SERVICE_NAME: bet-feed }
  extends: [.kaniko_build, .trivy_scan, .syft_sbom, .cosign_sign]

anti-doping-service:
  variables: { SERVICE_DIR: src/medicine/anti-doping-service, SERVICE_NAME: anti-doping-service }
  extends: [.kaniko_build, .trivy_scan, .syft_sbom, .cosign_sign]
