apiVersion: apps/v1
kind: Deployment
metadata:
  name: collectibles
  namespace: matchday
  labels:
    app.kubernetes.io/name: collectibles
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: fan-engagement
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: collectibles } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: collectibles, matchday.io/domain: fan-engagement }
    spec:
      serviceAccountName: collectibles
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: collectibles
          image: harbor.matchday.internal/matchday/collectibles:latest
          ports: [{ containerPort: 50202, name: http }]
          envFrom: [{ configMapRef: { name: collectibles } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50202 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50202 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
