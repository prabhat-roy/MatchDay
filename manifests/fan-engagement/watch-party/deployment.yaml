apiVersion: apps/v1
kind: Deployment
metadata:
  name: watch-party
  namespace: matchday
  labels:
    app.kubernetes.io/name: watch-party
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: fan-engagement
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: watch-party } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: watch-party, matchday.io/domain: fan-engagement }
    spec:
      serviceAccountName: watch-party
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: watch-party
          image: harbor.matchday.internal/matchday/watch-party:latest
          ports: [{ containerPort: 50203, name: http }]
          envFrom: [{ configMapRef: { name: watch-party } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50203 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50203 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
