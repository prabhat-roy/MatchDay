apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: watch-party
  namespace: matchday-fan-engagement
  labels:
    app.kubernetes.io/name: watch-party
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: fan-engagement
    matchday.io/marquee-critical: "true"
spec:
  serviceName: watch-party
  replicas: 4
  selector: { matchLabels: { app.kubernetes.io/name: watch-party } }
  template:
    metadata: { labels: { app.kubernetes.io/name: watch-party, matchday.io/domain: fan-engagement } }
    spec:
      serviceAccountName: watch-party
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: watch-party
          image: harbor.matchday.internal/matchday/watch-party:latest
          ports:
            - { containerPort: 4000, name: http }
            - { containerPort: 4369, name: epmd }
            - { containerPort: 9100, name: erlang }
          env:
            - { name: ERL_MAX_PORTS,  value: "1048576" }
            - { name: POOL_SIZE,      value: "32" }
            - { name: NATS_URL,       value: nats://matchday-nats.messaging:4222 }
            - { name: PRESENCE_TOPIC, value: match-ops.event.recorded }
          livenessProbe:  { httpGet: { path: /healthz, port: 4000 }, initialDelaySeconds: 30 }
          readinessProbe: { httpGet: { path: /healthz, port: 4000 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 1000m, memory: 2Gi }
            limits:   { cpu: 4000m, memory: 8Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
