apiVersion: apps/v1
kind: Deployment
metadata:
  name: scoring-engine
  namespace: matchday
  labels:
    app.kubernetes.io/name: scoring-engine
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: fantasy
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: scoring-engine } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: scoring-engine, matchday.io/domain: fantasy }
    spec:
      serviceAccountName: scoring-engine
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: scoring-engine
          image: harbor.matchday.internal/matchday/scoring-engine:latest
          ports: [{ containerPort: 50221, name: http }]
          envFrom: [{ configMapRef: { name: scoring-engine } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50221 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50221 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
