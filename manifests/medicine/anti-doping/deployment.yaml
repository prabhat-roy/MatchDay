apiVersion: apps/v1
kind: Deployment
metadata:
  name: anti-doping
  namespace: matchday
  labels:
    app.kubernetes.io/name: anti-doping
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: medicine
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: anti-doping } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: anti-doping, matchday.io/domain: medicine }
    spec:
      serviceAccountName: anti-doping
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: anti-doping
          image: harbor.matchday.internal/matchday/anti-doping:latest
          ports: [{ containerPort: 50123, name: http }]
          envFrom: [{ configMapRef: { name: anti-doping } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50123 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50123 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
