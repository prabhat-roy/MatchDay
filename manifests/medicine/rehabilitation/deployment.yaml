apiVersion: apps/v1
kind: Deployment
metadata:
  name: rehabilitation
  namespace: matchday
  labels:
    app.kubernetes.io/name: rehabilitation
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: medicine
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: rehabilitation } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: rehabilitation, matchday.io/domain: medicine }
    spec:
      serviceAccountName: rehabilitation
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: rehabilitation
          image: harbor.matchday.internal/matchday/rehabilitation:latest
          ports: [{ containerPort: 50121, name: http }]
          envFrom: [{ configMapRef: { name: rehabilitation } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50121 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50121 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
