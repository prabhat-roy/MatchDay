apiVersion: apps/v1
kind: Deployment
metadata:
  name: personalisation
  namespace: matchday
  labels:
    app.kubernetes.io/name: personalisation
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: merchandise
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: personalisation } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: personalisation, matchday.io/domain: merchandise }
    spec:
      serviceAccountName: personalisation
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: personalisation
          image: harbor.matchday.internal/matchday/personalisation:latest
          ports: [{ containerPort: 50282, name: http }]
          envFrom: [{ configMapRef: { name: personalisation } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50282 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50282 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
