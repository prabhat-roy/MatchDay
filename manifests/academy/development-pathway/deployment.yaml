apiVersion: apps/v1
kind: Deployment
metadata:
  name: development-pathway
  namespace: matchday
  labels:
    app.kubernetes.io/name: development-pathway
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: academy
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: development-pathway } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: development-pathway, matchday.io/domain: academy }
    spec:
      serviceAccountName: development-pathway
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: development-pathway
          image: harbor.matchday.internal/matchday/development-pathway:latest
          ports: [{ containerPort: 50302, name: http }]
          envFrom: [{ configMapRef: { name: development-pathway } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50302 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50302 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
