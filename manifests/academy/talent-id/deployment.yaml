apiVersion: apps/v1
kind: Deployment
metadata:
  name: talent-id
  namespace: matchday
  labels:
    app.kubernetes.io/name: talent-id
    app.kubernetes.io/part-of: matchday
    matchday.io/domain: academy
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: talent-id } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: talent-id, matchday.io/domain: academy }
    spec:
      serviceAccountName: talent-id
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: talent-id
          image: harbor.matchday.internal/matchday/talent-id:latest
          ports: [{ containerPort: 50301, name: http }]
          envFrom: [{ configMapRef: { name: talent-id } }]
          livenessProbe:  { httpGet: { path: /healthz, port: 50301 }, initialDelaySeconds: 15 }
          readinessProbe: { httpGet: { path: /healthz, port: 50301 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
